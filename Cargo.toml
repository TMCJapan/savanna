[package]
name = "savanna"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
linkify = "0.11"
url = "2"
dotenvy = "0.15"
# ウィジェット (公開エンドポイント) の取得用。serenity と同じ rustls バックエンドに揃える
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
